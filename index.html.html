<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152d4b"><title>푸드뱅크 인생네컷</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#15263c;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:18px 16px 48px}header{text-align:center;padding:12px}h1{margin:0;font-size:28px}p{line-height:1.5}header p{color:#58677a;margin:8px}.stage{background:white;border-radius:22px;padding:15px;box-shadow:0 8px 28px #163b6615}.camera{background:#111;position:relative;overflow:hidden;border-radius:16px;aspect-ratio:5/6;max-height:480px;display:grid;place-items:center}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}video.back{transform:none}.count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;color:white;text-shadow:0 4px 20px #0009;font-weight:900;pointer-events:none}.placeholder{color:#fff;text-align:center;padding:24px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.thumbs>div{aspect-ratio:5/8;border:2px dashed #c4cdda;border-radius:8px;overflow:hidden;display:grid;place-items:center;color:#778396;font-weight:700}.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs .taken{border:2px solid #2b81e8}button{border:0;border-radius:13px;padding:15px 18px;font-size:18px;font-weight:800;color:white;background:#236bd1;cursor:pointer;min-height:54px}button.secondary{background:#e7edf5;color:#1a3659}button.green{background:#147d5c}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.wide{grid-column:1/-1}.status{text-align:center;color:#39516f;min-height:28px;margin:12px 0}.result{display:none;text-align:center}.result img{display:block;width:100%;max-width:400px;margin:0 auto 12px;box-shadow:0 5px 20px #0002}.hint{font-size:13px;color:#617187;text-align:center}.print-only{display:none}@page{size:100mm 148mm;margin:0}@media print{html,body{margin:0!important;padding:0!important;background:white!important;width:100mm;height:148mm}.app{display:none!important}.print-only{display:block!important;position:absolute;top:0;left:0;width:100mm;height:148mm;margin:0;padding:0;overflow:hidden}.print-only img{display:block;width:100mm;height:148mm;object-fit:fill;max-width:none}}
</style></head><body><main class="app"><header><h1>📸 푸드뱅크 인생네컷</h1><p>5:8 세로 사진 4컷 · 아이패드 전용</p></header><section class="stage"><div id="captureUI"><div class="camera"><video id="video" playsinline autoplay muted></video><div class="count" id="count"></div><div class="placeholder" id="placeholder">카메라 시작을 눌러주세요</div></div><div class="thumbs" id="thumbs"></div><div class="status" id="status">카메라를 시작하면 촬영할 수 있습니다.</div><div class="actions"><button id="start">📷 카메라 시작</button><button id="switch" class="secondary">🔄 카메라 전환</button><button id="shoot" class="wide" disabled>✨ 4컷 자동 촬영</button><button id="reset" class="secondary wide">처음부터 다시</button></div></div><div class="result" id="result"><h2>사진이 완성됐어요!</h2><img id="final" alt="인생네컷 완성사진"><div class="actions"><button id="print" class="green">🖨️ 바로 인쇄</button><button id="share">📤 저장·공유</button><button id="again" class="secondary wide">📸 새로 촬영하기</button></div><p class="hint">인쇄 화면에서 Canon SELPHY CP1200을 선택하세요.<br>사진은 아이패드 내에서만 처리됩니다.</p></div></section><p class="hint">Safari에서 HTTPS로 열린 사이트여야 카메라가 작동합니다.<br>인쇄할 때는 아이패드와 프린터를 같은 Wi-Fi에 연결하세요.</p></main><div class="print-only"><img id="printImage" alt="인쇄 이미지"></div><script>
const $=id=>document.getElementById(id);let stream=null, facing='user', photos=[], busy=false, resultBlob=null;const video=$('video');
function note(s){$('status').textContent=s}function delay(ms){return new Promise(r=>setTimeout(r,ms))}
function refresh(){let t=$('thumbs');t.innerHTML='';for(let i=0;i<4;i++){let d=document.createElement('div');if(photos[i]){d.className='taken';let im=new Image();im.src=photos[i];d.appendChild(im)}else d.textContent=i+1;t.appendChild(d)}}
async function camera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Safari의 HTTPS 웹사이트에서 접속해 주세요.');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;video.classList.toggle('back',facing!=='user');await video.play();$('placeholder').style.display='none';$('shoot').disabled=false;note('준비 완료! 4컷 자동 촬영을 눌러주세요.')}catch(e){$('placeholder').style.display='block';$('shoot').disabled=true;note('카메라 사용 불가: '+e.message+' (설정에서 Safari 카메라 권한을 확인하세요)')}}
function take(){let vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)throw Error('카메라 화면을 읽을 수 없습니다.');const w=500,h=800,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');let cropW=Math.min(vw,vh*5/8),cropH=cropW*8/5;if(cropH>vh){cropH=vh;cropW=vh*5/8}let sx=(vw-cropW)/2,sy=(vh-cropH)/2;ctx.save();if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(video,sx,sy,cropW,cropH,0,0,w,h);ctx.restore();return c.toDataURL('image/jpeg',.94)}
async function compose(){let c=document.createElement('canvas');c.width=1200;c.height=1776;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#16345c';x.textAlign='center';x.font='bold 50px sans-serif';x.fillText('소소한 마을 나눔축제',600,76);let width=454,height=726,xs=[111,635],ys=[110,873];for(let i=0;i<4;i++){let im=new Image();im.src=photos[i];await im.decode();let px=xs[i%2],py=ys[Math.floor(i/2)];x.fillStyle='#f1f4f9';x.fillRect(px-6,py-6,width+12,height+12);x.drawImage(im,px,py,width,height)}x.fillStyle='#16345c';x.font='bold 35px sans-serif';x.fillText('동제주기초푸드뱅크 · 2026.10.24',600,1683);x.font='25px sans-serif';x.fillText('우리의 소중한 네 컷',600,1728);let url=c.toDataURL('image/jpeg',.97);$('final').src=url;$('printImage').src=url;resultBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',.97));$('captureUI').style.display='none';$('result').style.display='block'}
async function shoot(){if(busy||!stream)return;busy=true;$('shoot').disabled=true;photos=[];refresh();try{for(let i=0;i<4;i++){note((i+1)+'번째 사진 준비');for(let n=3;n>=1;n--){$('count').textContent=n;await delay(1000)}$('count').textContent='📸';photos.push(take());refresh();await delay(450);$('count').textContent=''}note('사진을 합성하는 중입니다.');await compose()}catch(e){note('촬영 오류: '+e.message)}finally{busy=false;$('count').textContent='';$('shoot').disabled=!stream}}
function reset(){photos=[];refresh();$('result').style.display='none';$('captureUI').style.display='block';note(stream?'다시 촬영할 준비가 됐어요.':'카메라를 시작하세요.')}async function share(){if(!resultBlob)return;let file=new File([resultBlob],'foodbank-fourcuts.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'푸드뱅크 인생네컷'});return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=$('final').src;a.download='foodbank-fourcuts.jpg';document.body.appendChild(a);a.click();a.remove()}
$('start').onclick=camera;$('switch').onclick=async()=>{facing=facing==='user'?'environment':'user';await camera()};$('shoot').onclick=shoot;$('reset').onclick=reset;$('again').onclick=reset;$('share').onclick=share;$('print').onclick=()=>{if(resultBlob)window.print()};refresh();
</script></body></html>
